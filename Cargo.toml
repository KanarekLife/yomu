[workspace]
resolver = "2"
members = ["crates/reader-core", "crates/yomu-server", "src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.3"
license = "MIT"

[profile.release]
# thin LTO keeps binaries small; default codegen-units (16) keeps CI builds fast (ADR-0014).
lto = "thin"
strip = true
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
