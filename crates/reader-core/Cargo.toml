[package]
name = "reader-core"
description = "Platform-independent core of the Japanese light-novel reader"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lindera = { version = "6.2", default-features = false, features = ["embed-ipadic"] }
rusqlite = { version = "0.42", features = ["bundled"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
scraper = "0.29"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "http2", "charset", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
