# Sync server container image → ghcr.io/kanareklife/yomu-server
# Tags: `main` (latest build of main) and `sha-<short>`.
name: Server image

on:
  push:
    branches: [main]
    paths:
      - crates/yomu-server/**
      - Cargo.lock
      - .github/workflows/server.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: server
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p yomu-server
        env:
          YOMU_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/kanareklife/yomu-server
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/yomu-server/Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=yomu-server
          cache-to: type=gha,mode=max,scope=yomu-server
