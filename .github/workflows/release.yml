# Builds Linux, Windows and Android packages and publishes a GitHub release.
# Trigger: push a tag like `v0.1.0`, or run manually (creates a draft release).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p reader-core
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run check

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage,deb,rpm
          - os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: ${{ matrix.os }} }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Collect bundles
        shell: bash
        run: |
          mkdir dist-release
          find target/release/bundle -maxdepth 2 -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.msi' \) \
            -exec cp {} dist-release/ \;
          ls -la dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: dist-release/*
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Install NDK and SDK platform
        run: |
          sdkmanager "ndk;${NDK_VERSION}" "platforms;android-37.0" "build-tools;36.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with: { key: android }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd src-tauri/gen/android
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            # No secrets: sign with a throwaway key so the APK is installable.
            # Updating to a build signed with a different key needs an uninstall first.
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; signing with a temporary key"
            ANDROID_KEY_ALIAS=yomu; ANDROID_KEY_PASSWORD=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype JKS -keyalg RSA -keysize 2048 \
              -validity 10000 -alias yomu -storepass "$ANDROID_KEY_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -dname "CN=Yomu"
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          fi
          printf 'keyAlias=%s\npassword=%s\nstoreFile=%s\n' "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" "$RUNNER_TEMP/release.jks" > keystore.properties
      - run: npx tauri android build --apk --aab
      - name: Collect packages
        run: |
          mkdir dist-release
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          for f in $(find src-tauri/gen/android/app/build/outputs -name '*.apk' -o -name '*.aab'); do
            ext="${f##*.}"; cp "$f" "dist-release/Yomu_${v}_android-universal.${ext}"
          done
          ls -la dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-android
          path: dist-release/*
          if-no-files-found: error

  release:
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, pattern: bundles-*, merge-multiple: true }
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: Yomu ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          generate_release_notes: true
